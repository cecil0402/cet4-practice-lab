<!DOCTYPE html>

  <meta name="mobile-web-app-capable" content="yes">

  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">C4</div>
        <div class="brand-copy">
          <strong>四级刷题实验室</strong>
          <span>CET-4 PRACTICE LAB</span>
        </div>
        <button class="mobile-close" id="mobile-close" aria-label="关闭菜单">×</button>
      </div>

      <div class="side-label">学习空间</div>
      <nav class="nav" id="main-nav">
        <a href="#/home" data-nav="home"><svg class="icon"><use href="#i-home"></use></svg><span>首页</span></a>
        <a href="#/practice" data-nav="practice"><svg class="icon"><use href="#i-layers"></use></svg><span>专项练习</span></a>
        <a href="#/vocab" data-nav="vocab"><svg class="icon"><use href="#i-book"></use></svg><span>四级词汇</span><em class="nav-badge" id="nav-vocab-badge">300</em></a>
        <a href="#/exam" data-nav="exam"><svg class="icon"><use href="#i-clock"></use></svg><span>模拟考试</span><em class="nav-badge" id="nav-exam-badge" hidden></em></a>
        <a href="#/wrong" data-nav="wrong"><svg class="icon"><use href="#i-rotate"></use></svg><span>错题本</span><em class="nav-badge" id="nav-wrong-badge">0</em></a>
        <a href="#/bookmarks" data-nav="bookmarks"><svg class="icon"><use href="#i-bookmark"></use></svg><span>收藏夹</span><em class="nav-badge" id="nav-bookmark-badge">0</em></a>
      </nav>

      <div class="side-label">我的进度</div>
      <nav class="nav">
        <a href="#/stats" data-nav="stats"><svg class="icon"><use href="#i-chart"></use></svg><span>学习数据</span></a>
        <a href="#/settings" data-nav="settings"><svg class="icon"><use href="#i-settings"></use></svg><span>设置与备份</span></a>
      </nav>

      <div class="side-progress">
        <div class="side-progress-head"><span>题库进度</span><strong id="side-progress-text">0%</strong></div>
        <div class="progress-track"><i id="side-progress-bar" style="width:0%"></i></div>
        <p id="side-progress-caption">还没有开始，先做 10 道题热身。</p>
      </div>

      <div class="sidebar-footer">
        <span class="status-dot"></span>
        <span>离线可用 · 数据保存在本机</span>
      </div>
    </aside>

    <div class="main-shell">
      <header class="topbar">
        <button class="icon-btn mobile-menu" id="mobile-menu" aria-label="打开菜单"><svg class="icon"><use href="#i-menu"></use></svg></button>
        <div class="crumb" id="crumb">首页</div>
        <div class="top-actions">
          <div class="streak-pill" title="连续学习天数"><svg class="icon"><use href="#i-spark"></use></svg><span id="top-streak">0</span> 天</div>
          <button class="icon-btn" id="theme-toggle" aria-label="切换主题"><svg class="icon"><use href="#i-moon"></use></svg></button>
          <button class="avatar" id="avatar-btn" aria-label="学习数据">C4</button>
        </div>
      </header>

      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>

  <div class="toast-stack" id="toast-stack" aria-live="polite"></div>
  <div class="modal-root" id="modal-root"></div>

  <noscript>
    <div class="noscript">这个刷题应用需要启用 JavaScript。请在浏览器设置中允许 JavaScript 后重新打开。</div>
  </noscript>

  <script src="data.js"></script>
  <script src="vocab.js"></script>
  <script src="vocab_extra.js"></script>
  <script src="vocab_more.js"></script>
  <script src="vocab_third.js"></script>
  <script src="collocations.js"></script>
  <script src="phrasal.js"></script>
  <script src="confusables.js"></script>
  <script src="app.js"></script>
</body>
</html>
